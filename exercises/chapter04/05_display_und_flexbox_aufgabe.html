<!--
    UEBUNG 5: DISPLAY UND FLEXBOX (Kapitel 4.4 - CSS Eigenschaften: display)

    Aufgabenstellung:
    Drei "Karten" sollen nebeneinander in einer Reihe angeordnet werden, ein
    Hilfstext soll unsichtbar bleiben und ein Badge soll neben einer
    Ueberschrift stehen. Ergaenzen Sie im style-Block an den TODO-Stellen:

    TODO 1: display: none fuer .versteckt ergaenzen, damit der Hilfstext
            nicht angezeigt wird.
    TODO 2: display: inline-block fuer .badge ergaenzen, damit das Badge in
            derselben Zeile wie die Ueberschrift dargestellt wird.
    TODO 3: display: flex fuer .kartencontainer ergaenzen.
    TODO 4: justify-content fuer .kartencontainer ergaenzen, damit die drei
            Karten gleichmaessig verteilt werden (z.B. space-between).
-->
<!DOCTYPE html>
<html>
<head>
    <title>Karten mit Flexbox</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        .versteckt {
            /* TODO 1: display: none ergaenzen */
        }

        .badge {
            /* TODO 2: display: inline-block ergaenzen */
            background-color: #e74c3c;
            color: white;
            padding: 2px 6px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .kartencontainer {
            /* TODO 3: display: flex ergaenzen */
            /* TODO 4: justify-content ergaenzen */
        }

        .karte {
            border: 1px solid #cccccc;
            padding: 15px;
            width: 30%;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

    <h1>Unsere Angebote</h1>

    <div class="versteckt">Dieser Hilfstext sollte auf der fertigen Seite nicht sichtbar sein.</div>

    <div class="kartencontainer">
        <div class="karte">
            <h2>Karte 1 <span class="badge">Neu</span></h2>
            <p>Beschreibungstext fuer die erste Karte.</p>
        </div>
        <div class="karte">
            <h2>Karte 2</h2>
            <p>Beschreibungstext fuer die zweite Karte.</p>
        </div>
        <div class="karte">
            <h2>Karte 3</h2>
            <p>Beschreibungstext fuer die dritte Karte.</p>
        </div>
    </div>

</body>
</html>
