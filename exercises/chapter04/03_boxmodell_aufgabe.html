<!--
    UEBUNG 3: BOXMODELL (Kapitel 4.4 - CSS Eigenschaften: Boxmodell)

    Aufgabenstellung:
    Drei ineinander verschachtelte Boxen (aussen, mitte, innen) sollen mit
    Rahmen, Aussen- und Innenabstaenden gestaltet werden. Ergaenzen Sie im
    style-Block an den TODO-Stellen:

    TODO 1: Rahmen (border) fuer .aussen als Shorthand ergaenzen
            (z.B. 3px solid).
    TODO 2: Breite (width: 300px) und box-sizing: border-box fuer .aussen
            ergaenzen, damit Rahmen und Innenabstand nicht zur Breite
            hinzugerechnet werden.
    TODO 3: Aussenabstand (margin) fuer .mitte als Shorthand ergaenzen
            (z.B. 20px auf allen Seiten).
    TODO 4: Innenabstand (padding) fuer .mitte einzeln pro Seite ergaenzen
            (padding-top, padding-right, padding-bottom, padding-left mit
            unterschiedlichen Werten).
    TODO 5: Negativen margin-top fuer .innen ergaenzen, damit die Innen-Box
            naeher an die Mitte-Box heranrueckt.
-->
<!DOCTYPE html>
<html>
<head>
    <title>Boxmodell</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        .aussen {
            /* TODO 1: border ergaenzen */
            /* TODO 2: width und box-sizing: border-box ergaenzen */
            padding: 10px;
            background-color: #eeeeff;
        }

        .mitte {
            /* TODO 3: margin (Shorthand) ergaenzen */
            /* TODO 4: padding einzeln pro Seite ergaenzen */
            border: 1px solid #999999;
            background-color: #ddddee;
        }

        .innen {
            /* TODO 5: negativen margin-top ergaenzen */
            border: 1px solid #999999;
            padding: 10px;
            background-color: #ccccdd;
        }

    </style>
</head>
<body>

    <h1>Boxmodell</h1>

    <!--
        Hinweis: Wenn zwei Boxen uebereinander liegen und beide einen
        vertikalen margin besitzen, wird nicht die Summe der beiden margins
        als Abstand verwendet, sondern nur der groessere der beiden Werte.
        Man spricht vom "Margin Collapsing". Dies betrifft ausschliesslich
        vertikale Aussenabstaende (margin-top / margin-bottom), niemals
        horizontale.
    -->

    <div class="aussen">
        Aussen-Box
        <div class="mitte">
            Mitte-Box
            <div class="innen">
                Innen-Box
            </div>
        </div>
    </div>

</body>
</html>
