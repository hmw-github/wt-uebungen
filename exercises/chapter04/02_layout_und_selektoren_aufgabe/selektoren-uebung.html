<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CSS Selektoren Übung</title>
    <style> 
        /** TODO 1: Kind-Selektor
          * Alle <p> Elemente, die irgendwo innerhalb von .container sind, sollen grüne Schrift bekommen.
          */
        
        /**
          * TODO 2: Direktes Kind-Selektor
          *         Nur die <p> Elemente, die direkte Kinder von 
          *         .container sind (nicht die in <article>!), sollen einen blauen Hintergrund bekommen.

        /** 
          * TODO 3: Direkter Nachfolger-Selektor
          *         Das erste <p> Element, das direkt nach einem <h2> kommt, soll rot und fett werden.
          */

        /**
          * TODO 4: Nachfolger-Selektor
          *         Alle <article> Elemente, die nach dem ersten <article> kommen, sollen eine graue Umrandung bekommen.
          */
        
    </style>
</head>
<body>
    <div class="container">
        <h1>Mein Blog</h1>
        <p>Einleitungstext direkt im Container.</p>
        
        <article>
            <h2>Erster Artikel</h2>
            <p>Dies ist der erste Absatz im Artikel.</p>
            <p>Dies ist der zweite Absatz im Artikel.</p>
            
            <div class="info">
                <p>Eine Info-Box im Artikel.</p>
            </div>
        </article>
        
        <article>
            <h2>Zweiter Artikel</h2>
            <p>Noch ein Absatz.</p>
        </article>
        
        <p>Abschlusstext direkt im Container.</p>
    </div>
</body>
</html>
