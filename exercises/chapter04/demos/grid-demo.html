<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    	<style>
        body {
            margin: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 200px 1fr; /* 2 Spalten: 200px + Rest */
            grid-template-rows: auto 1fr auto; /* 3 Zeilen: header + Rest + footer */
            grid-template-areas:
                "header header" /* header über 2 Spalten */
                "nav    content" /* 1. Spalte nav, 2. Spalte content */
                "footer footer"; /* footer über 2 Spalten */
            gap: 10px;
            min-height: 100vh;
            border: 2px solid blue;
            padding: 10px;
            box-sizing: border-box;
        }
        .grid-item {
            background-color: lightgreen;
            padding: 20px;
        }
        header { 
            grid-area: header; /* header tag in header-Bereich platzieren */
        }
        nav { 
            grid-area: nav; /* nav tag in nav-Bereich platzieren */
        }
        main { 
            grid-area: content; /* main tag in content-Bereich platzieren */
        }
        footer { 
            grid-area: footer; /* footer tag in footer-Bereich platzieren */
            text-align: center; 
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* small screens: stack everything in one column */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr; /* ... */
                grid-template-rows: auto auto 1fr auto; /* ... */
                grid-template-areas: /* ... */
                    "header"
                    "nav"
                    "content"
                    "footer";
            }
        }

	</style>
    </head>
    <body>
        <div class='grid-container'>
            <header class='grid-item'>
                <h1>My Application</h1>
            </header>
            <nav class='grid-item'>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
            <main class='grid-item'>
                <h2>Welcome</h2>
                <p>This is the main content area. It takes up all remaining space.</p>
            </main>
            <footer class='grid-item'>
                &copy; 2026 My Application
            </footer>
        </div>
    </body>
</html>
