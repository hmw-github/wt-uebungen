<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/druck.css" media="print">

</head>
<body>

    <header>
        <a href="index.php">
            <img src="images/logo.png" alt="Logo Alex Berger" height="50">
        </a>

        <button id="burgerButton" class="burger-button" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="hauptnav">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="hauptnav">
            <a href="index.php">Startseite</a>
            <a href="ueber-mich.html">Über mich</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
    </header>

    <main>
    <h1>Projekte</h1>

    <p>Auf dieser Seite stelle ich nach und nach einige meiner Projekte vor.</p>

    <button id="filterButton" class="btn">Projekte aus 2026 hervorheben</button>

    <table border="1">
        <caption>Meine Projekte</caption>
        <thead>
            <tr>
                <th>Projekt</th>
                <th>Technologie</th>
                <th>Jahr</th>
                <th>Link</th>
            </tr>
        </thead>
        <tbody id="projekteKoerper">
        </tbody>
        <tfoot>
            <tr>
                <td id="projekteAnzahl" colspan="4"></td>
            </tr>
        </tfoot>
    </table>

    </main>

    <footer>
        <p>
            <a href="https://github.com/alexberger" target="_blank">GitHub</a>
            &middot;
            <a href="rechtliches/impressum.html">Impressum</a>
        </p>
    </footer>

    <!-- Autor: Alex Berger -->

    <script>
        const projekte = [
            { titel: "Wetter-App", technologie: "JavaScript, Fetch API", jahr: 2024, link: "https://github.com/alexberger/wetter-app" },
            { titel: "Rezeptsammlung", technologie: "PHP, MySQL", jahr: 2025, link: "https://github.com/alexberger/rezeptsammlung" },
            { titel: "Portfolio-Website", technologie: "HTML, CSS, JavaScript, PHP, REST", jahr: 2026, link: "https://github.com/alexberger/portfolio" }
        ];

        const projekteKoerper = document.getElementById("projekteKoerper");
        const projekteAnzahl = document.getElementById("projekteAnzahl");

        for (const projekt of projekte) {
            const zeile = document.createElement("tr");

            const titelZelle = document.createElement("td");
            titelZelle.textContent = projekt.titel;
            zeile.appendChild(titelZelle);

            const technologieZelle = document.createElement("td");
            technologieZelle.textContent = projekt.technologie;
            zeile.appendChild(technologieZelle);

            const jahrZelle = document.createElement("td");
            jahrZelle.textContent = projekt.jahr;
            zeile.appendChild(jahrZelle);

            const linkZelle = document.createElement("td");
            const link = document.createElement("a");
            link.href = projekt.link;
            link.target = "_blank";
            link.textContent = "Repository";
            linkZelle.appendChild(link);
            zeile.appendChild(linkZelle);

            projekteKoerper.appendChild(zeile);
        }

        projekteAnzahl.textContent = "Anzahl Projekte: " + projekte.length;

        const filterButton = document.getElementById("filterButton");
        filterButton.addEventListener("click", function() {
            const zeilen = projekteKoerper.querySelectorAll("tr");
            for (const zeile of zeilen) {
                const jahrZelle = zeile.children[2];
                if (jahrZelle.textContent === "2026") {
                    zeile.classList.toggle("hervorgehoben");
                }
            }
        });
    </script>

    <script src="js/main.js" defer></script>
</body>
</html>
