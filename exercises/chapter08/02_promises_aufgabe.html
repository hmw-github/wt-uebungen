<!DOCTYPE html>
<html>
<head>
    <title>Promises</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Promises</h1>

    <p>Öffnen Sie die Browser-Konsole, um die Ausgabe zu sehen.</p>

    <script>
        // Fertige Hilfsfunktion: liefert ein Promise, das nach einer
        // zufälligen kurzen Verzögerung mit '{"number": N}' aufgelöst wird.
        function erzeugeZahlenPromise() {
            return new Promise(function(resolve, reject) {
                var verzögerung = Math.random() * 500;
                setTimeout(function() {
                    var zahl = Math.floor(Math.random() * 100);
                    resolve('{"number": ' + zahl + '}');
                }, verzögerung);
            });
        }

        // TODO 1: 10 Promises mittels erzeugeZahlenPromise() erzeugen

        // TODO 2: an jedes Promise .then() (JSON parsen, gerade Zahlen
        //         loggen) und .catch() (Fehler loggen) anhängen
    </script>

</body>
</html>
