    Unten ist eine fertige Hilfsfunktion erzeugeZahlenPromise() vorgegeben.
    Sie liefert ein Promise, das nach einer zufaelligen kurzen Verzoegerung
    mit einem JSON-String der Form '{"number": N}' aufgeloest (resolve) wird,
    wobei N eine Zufallszahl zwischen 0 und 99 ist.

<!DOCTYPE html>
<html>
<head>
    <title>Promises</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Promises</h1>

    <p>Oeffnen Sie die Browser-Konsole, um die Ausgabe zu sehen.</p>

    <script>
        // Fertige Hilfsfunktion: liefert ein Promise, das nach einer
        // zufaelligen kurzen Verzoegerung mit '{"number": N}' aufgeloest wird.
        function erzeugeZahlenPromise() {
            return new Promise(function(resolve, reject) {
                var verzoegerung = Math.random() * 500;
                setTimeout(function() {
                    var zahl = Math.floor(Math.random() * 100);
                    resolve('{"number": ' + zahl + '}');
                }, verzoegerung);
            });
        }

    </script>

</body>
</html>
