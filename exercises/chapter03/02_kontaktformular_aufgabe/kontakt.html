<!--

    Aufgabenstellung:
    Bauen Sie ein Kontaktformular für Ihre Portfolio-Seite. In Kapitel 6

    dieses Formular auswertet - achten Sie daher genau auf die name-Attribute.
    Ergänzen Sie an den TODO-Stellen:

    TODO 1: form-Tag mit action="kontakt-verarbeiten.php" und method="post".
    TODO 2: Ein einzeiliges Textfeld für den Namen (name="name"), mit
            zugehörigem label (per for/id verknüpft) und dem Attribut
            required.
    TODO 3: Ein E-Mail-Feld (input type="email", name="email") mit label,
            ebenfalls required.
    TODO 4: Zwei Radiobuttons für die bevorzugte Rückmeldung
            (name="rueckmeldung", Werte "email" und "telefon"), die
            denselben name-Wert besitzen, damit nur eine Option wählbar
            ist. Jeder Radiobutton braucht ein zugehöriges label.
    TODO 5: Eine Auswahlliste (select, name="betreff") mit mind. 3
            option-Einträgen ("Anfrage", "Feedback", "Sonstiges"), wobei
            eine Option per selected vorausgewählt ist.
    TODO 6: Ein mehrzeiliges Textfeld (textarea, name="nachricht") für die
            Nachricht, ebenfalls required.
    TODO 7: Eine Checkbox (name="newsletter") für "Ich möchte den

<!DOCTYPE html>
<html>
<head>
    <title>Alex Berger - Portfolio - Kontakt</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <header>
        <a href="index.html">
            <img src="images/logo.svg" alt="Logo Alex Berger" width="100" height="50">
        </a>

        <nav>
            <a href="index.html">Startseite</a>
            <a href="ueber-mich.html">Über mich</a>
            <a href="projekte.html">Projekte</a>
        </nav>
    </header>

    <h1>Kontakt</h1>

    <p>Ich freue mich über Nachrichten - schreiben Sie mir gerne!</p>

    <!-- TODO 1: form-Tag öffnen -->
    <form action="kontakt-verarbeiten.php" 
        method="post">

        <!-- TODO 2: Textfeld Name (required) -->
        <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
        </p>
        <!-- TODO 3: E-Mail-Feld (required) -->
        <p>
            <label for="email">E-Mail:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <!-- TODO 4: Radiobuttons bevorzugte Rückmeldung -->
        <p>
            Bevorzugte Rückmeldung:<br>
            <input type="radio" id="r-email" name="rueckmeldung">
            <label for="r-email">E-Mail</label> <br>
            
            <input type="radio" id="r-telefon" name="rueckmeldung" checked>
            <label for="r-telefon">Telefon</label> <br>
        </p>

        <!-- TODO 5: Auswahlliste Betreff -->
        <p>
            Betreff: <br>
            <select name="betreff">
                <option value="0">Anfrage</option>
                <option value="1">Feedback</option>
                <option value="2" selected>Sonstiges</option>
            </select>            
        </p>

        <!-- TODO 6: Textarea Nachricht (required) -->
        <p>
            <label for="nachricht">Nachricht:</label><br>
            <textarea id="nachricht" name="nachricht"></textarea>
        </p>

        <!-- TODO 7: Checkbox Newsletter -->
        <p>
            <input type="checkbox" id="newsletter" name="newsletter" checked>
            <label for="newsletter">Ich möchte den Newsletter erhalten</label>
        </p>

        <!-- TODO 8: Submit-Button -->
        <button>Absenden</button>

    <!-- form-Tag schließen -->
    </form>

    <footer>
        <p>
            <a href="https://github.com/alexberger" target="_blank">GitHub</a>
            &middot;
            <a href="rechtliches/impressum.html">Impressum</a>
        </p>
    </footer>

    <!-- Autor: Alex Berger -->

</body>
</html>
