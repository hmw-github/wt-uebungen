        // Fertige Hilfsfunktion: erzeugt eine Bootstrap-Card für ein Projekt.
        function erzeugeKarte(projekt) {
            var spalte = document.createElement('div');
            spalte.className = 'col-md-4 mb-3';

            var karte = document.createElement('div');
            karte.className = 'card';
            karte.dataset.jahr = String(projekt.jahr);

            var kopf = document.createElement('div');
            kopf.className = 'card-header';
            kopf.textContent = projekt.titel;
            karte.appendChild(kopf);

            var koerper = document.createElement('div');
            koerper.className = 'card-body';
            koerper.innerHTML =
                '<div class="row"><div class="col-4">Technologie:</div><div class="col-8">' + projekt.technologie + '</div></div>' +
                '<div class="row"><div class="col-4">Jahr:</div><div class="col-8">' + projekt.jahr + '</div></div>';
            karte.appendChild(koerper);

            var fuss = document.createElement('div');
            fuss.className = 'card-footer';

            var link = document.createElement('a');
            link.href = projekt.link;
            link.target = '_blank';
            link.className = 'btn btn-outline-secondary btn-sm';
            link.textContent = 'Repository';
            fuss.appendChild(link);

            var bearbeitenButton = document.createElement('button');
            bearbeitenButton.type = 'button';
            bearbeitenButton.className = 'btn btn-primary btn-sm';
            bearbeitenButton.textContent = 'Bearbeiten';

                projektBearbeiten(projekt.id);

                projektLoeschen(projekt.id);
            };
            fuss.appendChild(loeschenButton);

            karte.appendChild(fuss);
            spalte.appendChild(karte);
            return spalte;
        }
