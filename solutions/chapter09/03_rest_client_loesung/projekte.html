    <script>
        // Pfad der eigenen REST-Schnittstelle aus Übung 2 (dieser Ordner,
        // Unterordner "api/").
        const API_URL = 'api';

        var aktuelleProjektId = null;
        var projekteCache = [];

        // Fertige Hilfsfunktion: erzeugt eine Bootstrap-Card für ein Projekt.
        function erzeugeKarte(projekt) {
            var spalte = document.createElement('div');
            spalte.className = 'col-md-6 mb-3';

            var karte = document.createElement('div');
            karte.className = 'card projekt-card';
            karte.dataset.jahr = String(projekt.jahr);

            var kopf = document.createElement('div');
            kopf.className = 'card-header';
            kopf.textContent = projekt.titel;
            karte.appendChild(kopf);

            var koerper = document.createElement('div');
            koerper.className = 'card-body';
            koerper.innerHTML =
                '<div class="row"><div class="col-6">Technologie:</div><div class="col-6">' + projekt.technologie + '</div></div>' +
                '<div class="row"><div class="col-6">Jahr:</div><div class="col-6">' + projekt.jahr + '</div></div>';
            karte.appendChild(koerper);

            var fuss = document.createElement('div');
            fuss.className = 'card-footer';

            var buttonPanel = document.createElement('div');
            buttonPanel.style = 'text-align: center';

            var link = document.createElement('a');
            link.href = projekt.link;
            link.target = '_blank';
            link.className = 'btn btn-outline-secondary btn-sm';
            link.textContent = 'Repo';
            buttonPanel.append(link);

            var bearbeitenButton = document.createElement('button');
            bearbeitenButton.type = 'button';
            bearbeitenButton.className = 'btn btn-primary btn-sm mx-1';
            bearbeitenButton.innerHTML = '<i class="bi bi-pencil"></i>';
            bearbeitenButton.onclick = function () {
                projektBearbeiten(projekt.id);
            };
            buttonPanel.appendChild(bearbeitenButton);

            var loeschenButton = document.createElement('button');
            loeschenButton.type = 'button';
            loeschenButton.className = 'btn btn-danger btn-sm';
            loeschenButton.innerHTML = '<i class="bi bi-trash"></i>';
            loeschenButton.onclick = function () {
                projektLoeschen(projekt.id);
            };
            buttonPanel.appendChild(loeschenButton);
            fuss.appendChild(buttonPanel);

            karte.appendChild(fuss);
            spalte.appendChild(karte);
            return spalte;
        }

        async function ladeProjekte() {
            try {
                const antwort = await fetch(API_URL + '/projekte');
                const projekte = await antwort.json();

                projekteCache = projekte;

                const liste = document.getElementById('projekteListe');
                liste.innerHTML = '';

                projekte.sort((p1, p2) => p1.titel.localeCompare(p2.titel));
                projekte.forEach(function (projekt) {
                    liste.appendChild(erzeugeKarte(projekt));
                });

            } catch (fehler) {
                console.error('Fehler beim Laden der Projekte:', fehler);
            }
        }

        function neuesProjekt() {
            aktuelleProjektId = null;
            document.getElementById('modalTitelUeberschrift').textContent = 'Neues Projekt anlegen';
            document.getElementById('modalTitel').value = '';
            document.getElementById('modalTechnologie').value = '';
            document.getElementById('modalJahr').value = '';
            document.getElementById('modalLink').value = '';

            var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('bearbeitenModal'));
            modal.show();
        }

        function projektBearbeiten(id) {
            var projekt = projekteCache.find(function (p) { return p.id === id; });
            if (!projekt) {
                return;
            }

            aktuelleProjektId = id;
            document.getElementById('modalTitelUeberschrift').textContent = 'Projekt bearbeiten';
            document.getElementById('modalTitel').value = projekt.titel;
            document.getElementById('modalTechnologie').value = projekt.technologie;
            document.getElementById('modalJahr').value = projekt.jahr;
            document.getElementById('modalLink').value = projekt.link;

            var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('bearbeitenModal'));
            modal.show();
        }

        function schließen() {
            var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('bearbeitenModal'));
            modal.hide();
        }

        async function speichern() {
            try {
                const daten = {
                    titel: document.getElementById('modalTitel').value,
                    technologie: document.getElementById('modalTechnologie').value,
                    jahr: document.getElementById('modalJahr').value,
                    link: document.getElementById('modalLink').value
                };

                if (aktuelleProjektId === null) {
                    await fetch(API_URL + '/projekt', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(daten)
                    });
                } else {
                    await fetch(API_URL + '/projekt/' + aktuelleProjektId, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(daten)
                    });
                }

                await ladeProjekte();
                schließen();

            } catch (fehler) {
                console.error('Fehler beim Speichern des Projekts:', fehler);
            }
        }

        async function projektLoeschen(id) {
            try {
                await fetch(API_URL + '/projekt/' + id, {
                    method: 'DELETE'
                });

                await ladeProjekte();

            } catch (fehler) {
                console.error('Fehler beim Löschen des Projekts:', fehler);
            }
        }

        const filterButton = document.getElementById("filterButton");
        filterButton.addEventListener("click", function() {
            const karten = document.querySelectorAll('#projekteListe [data-jahr="2026"]');
            for (const karte of karten) {
                karte.classList.toggle("hervorgehoben");
            }
        });

        // Beim Laden der Seite direkt die aktuelle Projektliste anzeigen
        ladeProjekte();
    </script>
