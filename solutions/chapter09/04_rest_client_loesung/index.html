<!--
    LOESUNGSVORSCHLAG - UEBUNG 4: REST-CLIENT
-->
<!DOCTYPE html>
<html>
<head>
    <title>Buecher-Client</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Buecherverwaltung</h1>

    <button onclick="ladeBuecher()">Aktualisieren</button>

    <ul id="buecherliste"></ul>

    <h2>Neues Buch anlegen</h2>

    <label for="titelFeld">Titel:</label>
    <input type="text" id="titelFeld"><br><br>

    <label for="autorFeld">Autor:</label>
    <input type="text" id="autorFeld"><br><br>

    <button onclick="fuegeBuchHinzu()">Hinzufuegen</button>

    <script>
        // Pfad der REST-Schnittstelle aus Uebung 3 (Musterloesung). Diese
        // Seite laeuft im selben Docker-Setup (solutions/chapter09, Port
        // 8019) wie die Schnittstelle selbst, daher genuegt ein relativer,
        // same-origin Pfad ohne Host/Port.
        const API_BASIS_URL = '/03_rest_crud_api_loesung';

        async function ladeBuecher() {
            try {
                const antwort = await fetch(API_BASIS_URL + '/buecher');
                const buecher = await antwort.json();

                const liste = document.getElementById('buecherliste');
                liste.innerHTML = '';

                buecher.forEach(function (buch) {
                    const eintrag = document.createElement('li');
                    eintrag.textContent = buch.titel + ' - ' + buch.autor + ' ';

                    const loeschenButton = document.createElement('button');
                    loeschenButton.textContent = 'Loeschen';
                    loeschenButton.onclick = function () {
                        loescheBuch(buch.id);
                    };

                    eintrag.appendChild(loeschenButton);
                    liste.appendChild(eintrag);
                });

            } catch (fehler) {
                console.error('Fehler beim Laden der Buecher:', fehler);
            }
        }

        async function fuegeBuchHinzu() {
            try {
                const titelFeld = document.getElementById('titelFeld');
                const autorFeld = document.getElementById('autorFeld');

                await fetch(API_BASIS_URL + '/buch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        titel: titelFeld.value,
                        autor: autorFeld.value
                    })
                });

                await ladeBuecher();

                titelFeld.value = '';
                autorFeld.value = '';

            } catch (fehler) {
                console.error('Fehler beim Anlegen des Buchs:', fehler);
            }
        }

        async function loescheBuch(id) {
            try {
                await fetch(API_BASIS_URL + '/buch/' + id, {
                    method: 'DELETE'
                });

                await ladeBuecher();

            } catch (fehler) {
                console.error('Fehler beim Loeschen des Buchs:', fehler);
            }
        }

        // Beim Laden der Seite direkt die aktuelle Buecherliste anzeigen
        ladeBuecher();
    </script>

</body>
</html>
