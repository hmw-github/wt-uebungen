server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # REST-Ressourcen: jede Anfrage unterhalb von ".../api/" wird an das
    # jeweilige api/service.php weitergereicht (Pfad als "_url"-Query-
    # Parameter). Dies ist das nginx-Aequivalent zu der .htaccess-Regel
    #   RewriteRule ^(.*)$ service.php?_url=$1 [QSA,L]
    # die in den jeweiligen api/-Unterordnern weiterhin vorliegt, da sie
    # Teil der Musterloesung ist (Apache-Rewriting laut Skript). nginx
    # wertet .htaccess-Dateien grundsaetzlich nicht aus, daher wird die
    # gleiche Weiterleitung hier als Server-Konfiguration nachgebildet,
    # damit die Loesung auch unter nginx lauffaehig ist.
    #
    # Wichtig: Diese spezifischere Regel (endet auf ".../api/service.php")
    # muss VOR der allgemeinen Weiterleitungsregel stehen, da nginx bei
    # mehreren passenden regulaeren Ausdruecken immer den zuerst im File
    # stehenden Treffer verwendet. Andernfalls wuerde der interne Redirect
    # auf service.php erneut von der allgemeinen Regel abgefangen und die
    # Datei als statischer Text ausgeliefert statt von PHP ausgefuehrt zu
    # werden.
    location ~ ^/(02_rest_get_api_loesung|03_rest_crud_api_loesung|04_rest_client_loesung)/api/service\.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ ^/(02_rest_get_api_loesung|03_rest_crud_api_loesung|04_rest_client_loesung)/api(/.*)?$ {
        try_files $uri $uri/ /$1/api/service.php?_url=$2;
    }

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
