-->
<!DOCTYPE html>
<html>
<head>
    <title>Karten mit Flexbox</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        .versteckt {
            display: none;
        }

        .badge {
            display: inline-block;
            background-color: #e74c3c;
            color: white;
            padding: 2px 6px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .kartencontainer {
            display: flex;
            justify-content: space-between;
        }

        .karte {
            border: 1px solid #cccccc;
            padding: 15px;
            width: 30%;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

    <h1>Unsere Angebote</h1>

    <div class="versteckt">Dieser Hilfstext sollte auf der fertigen Seite nicht sichtbar sein.</div>

    <div class="kartencontainer">
        <div class="karte">
            <h2>Karte 1 <span class="badge">Neu</span></h2>
            <p>Beschreibungstext fuer die erste Karte.</p>
        </div>
        <div class="karte">
            <h2>Karte 2</h2>
            <p>Beschreibungstext fuer die zweite Karte.</p>
        </div>
        <div class="karte">
            <h2>Karte 3</h2>
            <p>Beschreibungstext fuer die dritte Karte.</p>
        </div>
    </div>

</body>
</html>
