    LOESUNGSVORSCHLAG - UEBUNG 2: GRUNDLAGEN CSS-SELEKTOREN
-->
<!DOCTYPE html>
<html>
<head>
    <title>Grundlagen der CSS-Selektoren</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        li {
            list-style-type: none;
        }

        #hauptbereich {
            background-color: #f5f5f5;
            padding: 15px;
        }

        .hervorgehoben {
            color: #c0392b;
            font-weight: bold;
        }

        input[type="text"] {
            border: 1px solid #999999;
        }

        #suchfeld {
            width: 12rem;
        }

    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Start</a></li>
            <li><a href="#">Ueber uns</a></li>
            <li><a href="#">Kontakt</a></li>
        </ul>
    </nav>

    <div id="hauptbereich">
        <h1>Willkommen</h1>
        <p class="hervorgehoben">Dieser Absatz soll durch einen Klassen-Selektor besonders hervorgehoben werden.</p>
        <p>Dieser Absatz bleibt unveraendert.</p>
    </div>

    <form>
        <label for="suchfeld">Suche:</label>
        <input type="text" id="suchfeld" name="suche">
    </form>

</body>
</html>
