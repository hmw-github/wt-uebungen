-->
<!DOCTYPE html>
<html>
<head>
    <title>Boxmodell</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        .aussen {
            border: 3px solid #333333;
            width: 300px;
            box-sizing: border-box;
            padding: 10px;
            background-color: #eeeeff;
        }

        .mitte {
            margin: 20px;
            padding-top: 10px;
            padding-right: 25px;
            padding-bottom: 10px;
            padding-left: 25px;
            border: 1px solid #999999;
            background-color: #ddddee;
        }

        .innen {
            margin-top: -10px;
            border: 1px solid #999999;
            padding: 10px;
            background-color: #ccccdd;
        }

    </style>
</head>
<body>

    <h1>Boxmodell</h1>

    <!--
        Hinweis: Wenn zwei Boxen uebereinander liegen und beide einen
        vertikalen margin besitzen, wird nicht die Summe der beiden margins
        als Abstand verwendet, sondern nur der groessere der beiden Werte.
        Man spricht vom "Margin Collapsing". Dies betrifft ausschliesslich
        vertikale Aussenabstaende (margin-top / margin-bottom), niemals
        horizontale.
    -->

    <div class="aussen">
        Aussen-Box
        <div class="mitte">
            Mitte-Box
            <div class="innen">
                Innen-Box
            </div>
        </div>
    </div>

</body>
</html>
