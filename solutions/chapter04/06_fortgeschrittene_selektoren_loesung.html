<!DOCTYPE html>
<html>
<head>
    <title>Fortgeschrittene Selektoren</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        nav > ul {
            list-style-type: none;
            padding: 0;
        }

        h2 + p {
            font-style: italic;
            color: #555555;
        }

        nav a:hover {
            background-color: #2c3e50;
            color: white;
        }

        tbody tr:nth-child(odd) {
            background-color: #f2f2f2;
        }

        nav a::before {
            content: "\00BB ";
        }

        table, th, td {
            border: 1px solid #999999;
            border-collapse: collapse;
            padding: 5px 10px;
        }

    </style>
</head>
<body>

    <nav>
        <ul>

        </thead>

</body>
</html>
