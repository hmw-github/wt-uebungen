<!DOCTYPE html>
<html>
<head>
    <title>Klassen und Vererbung</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Klassen und Vererbung</h1>

    <pre id="ausgabe"></pre>

    <script>
        function ausgabe(text) {
            console.log(text);
            document.getElementById("ausgabe").textContent += text + "\n";
        }

        class Projekt {
            constructor(titel, jahr) {
                this._titel = titel;
                this._jahr = jahr;
            }

            get titel() {
                return this._titel;
            }

            set titel(neuerTitel) {
                this._titel = neuerTitel;
            }

            get jahr() {
                return this._jahr;
            }

            set jahr(neuesJahr) {
                if (neuesJahr < 2000) {
                    throw "Jahr darf nicht vor 2000 liegen!";
                }
                this._jahr = neuesJahr;
            }

            toString() {
                return this._titel + " (" + this._jahr + ")";
            }
        }

        class Webprojekt extends Projekt {
            constructor(titel, jahr, technologie) {
                super(titel, jahr);
                this._technologie = technologie;
            }

            get technologie() {
                return this._technologie;
            }

            set technologie(neueTechnologie) {
                this._technologie = neueTechnologie;
            }

            toString() {
                return super.toString() + ", Technologie: " + this._technologie;
            }
        }

        const projekt = new Webprojekt("Portfolio-Website", 2026, "PHP, REST");
        ausgabe(projekt.toString());

        try {
            projekt.jahr = 1990;
        } catch (fehler) {
            ausgabe("Fehler abgefangen: " + fehler);
        }
    </script>

</body>
</html>
