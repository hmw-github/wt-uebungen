<!DOCTYPE html>
<html>
<head>
    <title>Kontrollstrukturen</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Kontrollstrukturen</h1>

    <pre id="ausgabe"></pre>

    <h2>Projektliste</h2>
    <ul id="projekteListe"></ul>

    <script>
        function ausgabe(text) {
            console.log(text);
            document.getElementById("ausgabe").textContent += text + "\n";
        }

        let jahreBisAbschluss = -1;
        if (jahreBisAbschluss > 0) {
            ausgabe(jahreBisAbschluss + " ist positiv.");
        } else if (jahreBisAbschluss < 0) {
            ausgabe(jahreBisAbschluss + " ist negativ.");
        } else {
            ausgabe(jahreBisAbschluss + " ist null.");
        }

        let bewertung = 2;
        switch (bewertung) {
            case 1:
                ausgabe("Note " + bewertung + ": Sehr gut");
                break;
            case 2:
                ausgabe("Note " + bewertung + ": Gut");
                break;
            case 3:
                ausgabe("Note " + bewertung + ": Befriedigend");
                break;
            case 4:
                ausgabe("Note " + bewertung + ": Ausreichend");
                break;
            case 5:
                ausgabe("Note " + bewertung + ": Mangelhaft");
                break;
            case 6:
                ausgabe("Note " + bewertung + ": Ungenügend");
                break;
            default:
                ausgabe("Ungültige Note: " + bewertung);
        }

        let summe = 0;
        for (let i = 1; i <= 10; i++) {
            summe += i;
        }
        ausgabe("Summe von 1 bis 10: " + summe);

        const projekte = ["Wetter-App", "Rezeptsammlung", "Portfolio-Website"];

        for (const projekt of projekte) {
            const li = document.createElement("li");
            li.textContent = projekt;
            document.getElementById("projekteListe").appendChild(li);
        }
    </script>

</body>
</html>
