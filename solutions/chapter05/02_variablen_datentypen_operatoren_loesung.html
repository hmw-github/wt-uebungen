<!DOCTYPE html>
<html>
<head>
    <title>Variablen, Datentypen und Operatoren</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Variablen, Datentypen und Operatoren</h1>

    <p>Die Ergebnisse erscheinen unten auf der Seite und zusätzlich in der
    Entwicklerkonsole (F12).</p>

    <pre id="ausgabe"></pre>

    <script>
        function ausgabe(text) {
            console.log(text);
            document.getElementById("ausgabe").textContent += text + "\n";
        }

        let projektName = "Portfolio-Website";
        const jahr = 2026;
        var istOnline = true;
        ausgabe("projektName (" + typeof projektName + "): " + projektName);
        ausgabe("jahr (" + typeof jahr + "): " + jahr);
        ausgabe("istOnline (" + typeof istOnline + "): " + istOnline);

        let kapitelText = "Kapitel " + 5;
        ausgabe("kapitelText (" + typeof kapitelText + "): " + kapitelText);

        let striktGleich = (2026 === "2026");
        let unstriktGleich = (2026 == "2026");
        ausgabe("2026 === \"2026\": " + striktGleich);
        ausgabe("2026 == \"2026\": " + unstriktGleich);
    </script>

</body>
</html>
