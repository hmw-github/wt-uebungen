<!DOCTYPE html>
<html>
<head>
    <title>To-Do-Liste</title>
    <meta charset="UTF-8">
    <style>
        .erledigt {
            text-decoration: line-through;
            color: gray;
        }
        li {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>To-Do-Liste</h1>

    <p>Klicken Sie auf einen Eintrag, um ihn als erledigt zu markieren.</p>

    <ul id="liste">
        <li>Einkaufen gehen</li>
        <li>Hausaufgaben fuer WT erledigen</li>
    </ul>

    <input type="text" id="neuerEintrag" placeholder="Neuer Eintrag">
    <button id="hinzufuegenButton">Hinzufuegen</button>

    <script>
        const eingabeFeld = document.getElementById("neuerEintrag");
        const hinzufuegenButton = document.getElementById("hinzufuegenButton");
        const liste = document.getElementById("liste");

        hinzufuegenButton.addEventListener("click", function() {
            const text = eingabeFeld.value.trim();
            if (text === "") {
                return;
            }
            const neuesElement = document.createElement("li");
            neuesElement.textContent = text;
            liste.appendChild(neuesElement);
            eingabeFeld.value = "";
        });

        liste.addEventListener("click", function(event) {
            if (event.target.tagName === "LI") {
                event.target.classList.toggle("erledigt");
            }
        });
    </script>

</body>
</html>
