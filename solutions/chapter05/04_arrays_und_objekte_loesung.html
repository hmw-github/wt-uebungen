<!DOCTYPE html>
<html>
<head>
    <title>Arrays und Objekte</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Arrays und Objekte</h1>

    <pre id="ausgabe"></pre>

    <script>
        function ausgabe(text) {
            console.log(text);
            document.getElementById("ausgabe").textContent += text + "\n";
        }

        let jahre = [2022, 2025, 2023, 2024];
        jahre.push(2026);
        jahre.sort(function(a, b) {
            return a - b;
        });
        ausgabe("jahre (sortiert): " + jahre);

        let [erstesJahr, zweitesJahr, drittesJahr] = jahre;
        ausgabe("erstesJahr: " + erstesJahr + ", zweitesJahr: " + zweitesJahr + ", drittesJahr: " + drittesJahr);

        let projekt = {
            titel: "Portfolio-Website",
            technologie: "HTML, CSS, JavaScript",
            jahr: 2026,
            beschreibung: function() {
                return this.titel + " (" + this.jahr + "), gebaut mit " + this.technologie;
            }
        };
        ausgabe(projekt.beschreibung());
        ausgabe("Titel (Punktnotation): " + projekt.titel);
        ausgabe("Technologie (Klammernotation): " + projekt["technologie"]);
    </script>

</body>
</html>
