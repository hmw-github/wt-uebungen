<!DOCTYPE html>
<html>
<head>
    <title>JSON</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>JSON</h1>

    <pre id="ausgabe"></pre>

    <script>
        function ausgabe(text) {
            console.log(text);
            document.getElementById("ausgabe").textContent += text + "\n";
        }

        let projekt = {
            titel: "Portfolio-Website",
            technologie: "PHP, REST",
            jahr: 2026
        };
        let json = JSON.stringify(projekt);
        ausgabe("JSON-String: " + json);

        localStorage.setItem("letztesProjekt", json);

        let gelesenerJson = localStorage.getItem("letztesProjekt");
        let wiederhergestellt = JSON.parse(gelesenerJson);
        ausgabe("Wiederhergestellter Titel: " + wiederhergestellt.titel);
        ausgabe("Wiederhergestelltes Jahr: " + wiederhergestellt.jahr);
    </script>

</body>
</html>
