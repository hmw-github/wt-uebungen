    <p></p>

    <button onclick="zeigeAlert()">Info anzeigen</button>

    <!--
        Hinweis: Eingebundene externe Skripte werden idealerweise erst am
        Ende des body platziert (wie unten), damit das HTML-Dokument
        bereits vollstaendig geladen ist, bevor das Skript darauf
        zugreift. Alternativ kann man am script-Tag im head auch das
        Attribut "defer" (Ausfuehrung erst nach dem Parsen des Dokuments,
        in Dokumentreihenfolge) oder "async" (Ausfuehrung sobald das
        Skript geladen ist, Reihenfolge nicht garantiert) verwenden.
    -->
