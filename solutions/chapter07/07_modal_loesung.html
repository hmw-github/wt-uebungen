<!DOCTYPE html>
<html lang="de">
<head>
    <title>Personen-Karten mit Modal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">

        <h1>Unsere Kontakte</h1>

        <div class="row">

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header" id="card1-name">Anna Schmidt</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-4">Wo:</div>
                            <div class="col-8" id="card1-wo">Berlin</div>
                        </div>
                        <div class="row">
                            <div class="col-4">Alter:</div>
                            <div class="col-8" id="card1-alter">23</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn btn-primary" onclick="kontaktBearbeiten('card1')">Bearbeiten</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header" id="card2-name">Max Mustermann</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-4">Wo:</div>
                            <div class="col-8" id="card2-wo">Muenchen</div>
                        </div>
                        <div class="row">
                            <div class="col-4">Alter:</div>
                            <div class="col-8" id="card2-alter">25</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn btn-primary" onclick="kontaktBearbeiten('card2')">Bearbeiten</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header" id="card3-name">Julia Weber</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-4">Wo:</div>
                            <div class="col-8" id="card3-wo">Hamburg</div>
                        </div>
                        <div class="row">
                            <div class="col-4">Alter:</div>
                            <div class="col-8" id="card3-alter">21</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn btn-primary" onclick="kontaktBearbeiten('card3')">Bearbeiten</button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div class="modal" id="bearbeitenModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Kontakt bearbeiten</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schliessen"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="modalName" class="form-label">Name:</label>
                        <input type="text" class="form-control" id="modalName">
                    </div>
                    <div class="mb-3">
                        <label for="modalWo" class="form-label">Wo:</label>
                        <input type="text" class="form-control" id="modalWo">
                    </div>
                    <div class="mb-3">
                        <label for="modalAlter" class="form-label">Alter:</label>
                        <input type="number" class="form-control" id="modalAlter">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="schliessen()">Abbrechen</button>
                    <button type="button" class="btn btn-primary" onclick="speichern()">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var aktuelleCardId = null;

        function kontaktBearbeiten(cardId) {
            aktuelleCardId = cardId;

            var name = document.getElementById(cardId + '-name').textContent;
            var wo = document.getElementById(cardId + '-wo').textContent;
            var alter = document.getElementById(cardId + '-alter').textContent;

            document.getElementById('modalName').value = name;
            document.getElementById('modalWo').value = wo;
            document.getElementById('modalAlter').value = alter;

            var modalElement = document.getElementById('bearbeitenModal');
            var modal = bootstrap.Modal.getOrCreateInstance(modalElement);
            modal.show();
        }

        function schliessen() {
            var modalElement = document.getElementById('bearbeitenModal');
            var modal = bootstrap.Modal.getOrCreateInstance(modalElement);
            modal.hide();
        }

        function speichern() {
            if (aktuelleCardId === null) {
                return;
            }

            document.getElementById(aktuelleCardId + '-name').textContent = document.getElementById('modalName').value;
            document.getElementById(aktuelleCardId + '-wo').textContent = document.getElementById('modalWo').value;
            document.getElementById(aktuelleCardId + '-alter').textContent = document.getElementById('modalAlter').value;

            schliessen();
        }
    </script>
</body>
</html>
