<!--
    LOESUNGSVORSCHLAG - UEBUNG 4: CARDS
-->
<!DOCTYPE html>
<html lang="de">
<head>
    <title>Personen-Karten</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">

        <h1>Unsere Kontakte</h1>

        <div class="row">

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header" id="card1-name">Anna Schmidt</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-4">Wo:</div>
                            <div class="col-8" id="card1-wo">Berlin</div>
                        </div>
                        <div class="row">
                            <div class="col-4">Alter:</div>
                            <div class="col-8" id="card1-alter">23</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn btn-primary" onclick="kontaktBearbeiten('card1')">Bearbeiten</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header" id="card2-name">Max Mustermann</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-4">Wo:</div>
                            <div class="col-8" id="card2-wo">Muenchen</div>
                        </div>
                        <div class="row">
                            <div class="col-4">Alter:</div>
                            <div class="col-8" id="card2-alter">25</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn btn-primary" onclick="kontaktBearbeiten('card2')">Bearbeiten</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header" id="card3-name">Julia Weber</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-4">Wo:</div>
                            <div class="col-8" id="card3-wo">Hamburg</div>
                        </div>
                        <div class="row">
                            <div class="col-4">Alter:</div>
                            <div class="col-8" id="card3-alter">21</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn btn-primary" onclick="kontaktBearbeiten('card3')">Bearbeiten</button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function kontaktBearbeiten(cardId) {
            alert('Bearbeiten wurde fuer Kontakt "' + cardId + '" aufgerufen.');
            console.log('kontaktBearbeiten aufgerufen mit cardId =', cardId);
        }
    </script>
</body>
</html>
