<!DOCTYPE html>
<html lang="de">
<head>
    <title>Feedback-Formular</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">

        <h1>Feedback</h1>

        <form>

            <div class="mb-3">
                <label for="nameFeld" class="form-label">Name:</label>
                <input type="text" class="form-control" id="nameFeld" name="name">
            </div>

            <div class="mb-3">
                <label for="emailFeld" class="form-label">E-Mail:</label>
                <input type="email" class="form-control" id="emailFeld" name="email">
            </div>

            <div class="mb-3">
                <label for="nachrichtFeld" class="form-label">Nachricht:</label>
                <textarea class="form-control" id="nachrichtFeld" name="nachricht" rows="4"></textarea>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="zustimmungFeld" name="zustimmung">
                <label class="form-check-label" for="zustimmungFeld">Ich stimme zu</label>
            </div>

            <button type="submit" class="btn btn-primary">Absenden</button>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var emailFeld = document.getElementById('emailFeld');

        emailFeld.addEventListener('blur', function () {
            if (emailFeld.value.includes('@')) {
                emailFeld.classList.remove('is-invalid');
                emailFeld.classList.add('is-valid');
            } else {
                emailFeld.classList.remove('is-valid');
                emailFeld.classList.add('is-invalid');
            }
        });
    </script>
</body>
</html>
