    LOESUNGSVORSCHLAG - UEBUNG 3: BUTTONS
-->
<!DOCTYPE html>
<html lang="de">
<head>
    <title>Buttons</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">

        <h1>Buttons</h1>

        <h2>Stil-Varianten</h2>
        <p>
            <button type="button" class="btn btn-primary">Speichern</button>
            <button type="button" class="btn btn-secondary">Abbrechen</button>
            <button type="button" class="btn btn-success">Bestaetigen</button>
            <button type="button" class="btn btn-danger">Loeschen</button>
        </p>

        <h2>Groessen-Varianten</h2>
        <p>
            <button type="button" class="btn btn-primary btn-lg">Grosser Button</button>
            <button type="button" class="btn btn-secondary btn-sm">Kleiner Button</button>
        </p>

        <h2>Deaktivierter Button</h2>
        <p>
            <button type="button" class="btn btn-danger" disabled>Nicht verfuegbar</button>
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
