    <main>
    <div class="container mt-4">

        <h1>Projekte</h1>

        <p>Auf dieser Seite stelle ich nach und nach einige meiner Projekte vor.</p>

        <button id="filterButton" class="btn btn-secondary mb-3">Projekte aus 2026 hervorheben</button>

        <div class="row" id="projekteKoerper">
        </div>

    </div>

    <div class="modal" id="bearbeitenModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Projekt bearbeiten</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="modalTitel" class="form-label">Titel:</label>
                        <input type="text" class="form-control" id="modalTitel">
                    </div>
                    <div class="mb-3">
                        <label for="modalTechnologie" class="form-label">Technologie:</label>
                        <input type="text" class="form-control" id="modalTechnologie">
                    </div>
                    <div class="mb-3">
                        <label for="modalJahr" class="form-label">Jahr:</label>
                        <input type="number" class="form-control" id="modalJahr">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="schließen()">Abbrechen</button>
                    <button type="button" class="btn btn-primary" onclick="speichern()">Speichern</button>
                </div>
            </div>
        </div>

    <footer>
        <p>
            <a href="https://github.com/alexberger" target="_blank">GitHub</a>
            &middot;
            <a href="rechtliches/impressum.html">Impressum</a>

    <!-- Autor: Alex Berger -->

    <script>
        const projekte = [
            { titel: "Wetter-App", technologie: "JavaScript, Fetch API", jahr: 2024, link: "https://github.com/alexberger/wetter-app" },
            { titel: "Rezeptsammlung", technologie: "PHP, MySQL", jahr: 2025, link: "https://github.com/alexberger/rezeptsammlung" },
            { titel: "Portfolio-Website", technologie: "HTML, CSS, JS, PHP, REST", jahr: 2026, link: "https://github.com/alexberger/portfolio" }
        ];

        var aktuelleCardId = null;

        function projektBearbeiten(cardId) {
            aktuelleCardId = cardId;

            var titel = document.getElementById(cardId + '-titel').textContent;
            var technologie = document.getElementById(cardId + '-technologie').textContent;
            var jahr = document.getElementById(cardId + '-jahr').textContent;

            document.getElementById('modalTitel').value = titel;
            document.getElementById('modalTechnologie').value = technologie;
            document.getElementById('modalJahr').value = jahr;

            var modalElement = document.getElementById('bearbeitenModal');
            var modal = bootstrap.Modal.getOrCreateInstance(modalElement);
            modal.show();
        }

        function schließen() {
            var modalElement = document.getElementById('bearbeitenModal');
            var modal = bootstrap.Modal.getOrCreateInstance(modalElement);
            modal.hide();
        }

        function speichern() {
            if (aktuelleCardId === null) {
                return;
            }

            document.getElementById(aktuelleCardId + '-titel').textContent = document.getElementById('modalTitel').value;
            document.getElementById(aktuelleCardId + '-technologie').textContent = document.getElementById('modalTechnologie').value;
            document.getElementById(aktuelleCardId + '-jahr').textContent = document.getElementById('modalJahr').value;
            document.getElementById(aktuelleCardId).dataset.jahr = document.getElementById('modalJahr').value;

            schließen();
        }

        const projekteKoerper = document.getElementById("projekteKoerper");

        let index = 0;
        for (const projekt of projekte) {
            index++;
            const cardId = "card" + index;

            const spalte = document.createElement("div");
            spalte.className = "col-md-6 mb-3";

            const card = document.createElement("div");
            card.id = cardId;
            card.className = "card";
            card.dataset.jahr = projekt.jahr;

            const titel = document.createElement("div");
            titel.className = "card-header";
            titel.id = cardId + "-titel";
            titel.textContent = projekt.titel;
            card.appendChild(titel);

            const body = document.createElement("div");
            body.className = "card-body";

            const technologieAbsatz = document.createElement("p");
            technologieAbsatz.className = "card-text mb-1";
            const technologieLabel = document.createElement("strong");
            technologieLabel.textContent = "Technologie:";
            const technologieWert = document.createElement("span");
            technologieWert.id = cardId + "-technologie";
            technologieWert.textContent = projekt.technologie;
            technologieAbsatz.append(technologieLabel, " ", technologieWert);
            body.appendChild(technologieAbsatz);

            const jahrAbsatz = document.createElement("p");
            jahrAbsatz.className = "card-text";
            const jahrLabel = document.createElement("strong");
            jahrLabel.textContent = "Jahr:";
            const jahrWert = document.createElement("span");
            jahrWert.id = cardId + "-jahr";
            jahrWert.textContent = projekt.jahr;
            jahrAbsatz.append(jahrLabel, " ", jahrWert);
            body.appendChild(jahrAbsatz);

            card.appendChild(body);

            const footer = document.createElement("div");
            footer.className = "card-footer";

            const link = document.createElement("a");
            link.href = projekt.link;
            link.target = "_blank";
            link.className = "btn btn-outline-secondary btn-sm";
            link.textContent = "Repository";
            footer.appendChild(link);

            const bearbeitenButton = document.createElement("button");
            bearbeitenButton.type = "button";
            bearbeitenButton.className = "btn btn-primary btn-sm";
            bearbeitenButton.textContent = "Bearbeiten";
            bearbeitenButton.addEventListener("click", function() {
                projektBearbeiten(cardId);
            });
            footer.appendChild(bearbeitenButton);

            card.appendChild(footer);
            spalte.appendChild(card);
            projekteKoerper.appendChild(spalte);
        }

        const filterButton = document.getElementById("filterButton");
        filterButton.addEventListener("click", function() {
            const karten = document.querySelectorAll('[data-jahr="2026"]');
            for (const karte of karten) {
                karte.classList.toggle("hervorgehoben");
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js" defer></script>
</body>
