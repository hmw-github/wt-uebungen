<!DOCTYPE html>
<html>
<head>
    <title>Protokoll mit AJAX</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Protokoll mit AJAX</h1>

    <label for="nachrichtFeld">Nachricht:</label>
    <input type="text" id="nachrichtFeld">
    <button onclick="addProtocolEntry()">Speichern</button>

    <h2>Protokoll</h2>
    <ul id="liste"></ul>

    <script>
        // Fertige Hilfsfunktionen zur Anzeige der Liste.
        function createListElement(text) {
            var li = document.createElement("li");
            li.textContent = text;
            return li;
        }

        function clearList() {
            document.getElementById("liste").innerHTML = "";
        }

        function fillList(entries) {
            clearList();
            var liste = document.getElementById("liste");
            for (var i = 0; i < entries.length; i++) {
                liste.appendChild(createListElement(entries[i]));
            }
        }

        function onLoad() {
            fetch("api.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ action: "list" })
            })
                .then(function(response) {
                    return response.json();
                })
                .then(function(antwort) {
                    fillList(antwort.entries);
                })
                .catch(function(fehler) {
                    console.error(fehler);
                });
        }

        function addProtocolEntry() {
            var nachricht = document.getElementById("nachrichtFeld").value;

            if (nachricht === "") {
                alert("Bitte geben Sie eine Nachricht ein.");
                return;
            }

            fetch("api.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ action: "save", message: nachricht })
            })
                .then(function(response) {
                    return response.json();
                })
                .then(function(antwort) {
                    fillList(antwort.entries);
                    document.getElementById("nachrichtFeld").value = "";
                })
                .catch(function(fehler) {
                    console.error(fehler);
                });
        }

        window.addEventListener("load", onLoad);
    </script>

</body>
</html>
