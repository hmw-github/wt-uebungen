<!DOCTYPE html>
<html lang="de">
<head>
    <title>Benutzerverzeichnis (XMLHttpRequest)</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Benutzerverzeichnis</h1>

    <p id="status">Daten werden geladen ...</p>

    <div id="karten" class="karten"></div>

    <script>
        const API_URL = "https://jsonplaceholder.typicode.com/users";

        // Erzeugt aus einem Benutzer-Objekt ein <article>-Element (Karte).
        function erzeugeKarte(benutzer) {
            const karte = document.createElement("article");
            karte.className = "karte";

            const name = document.createElement("h2");
            name.textContent = benutzer.name;

            const untertitel = document.createElement("p");
            untertitel.className = "untertitel";
            untertitel.textContent = "@" + benutzer.username;

            const email = document.createElement("p");
            email.textContent = "E-Mail: " + benutzer.email;

            const ort = document.createElement("p");
            ort.textContent = "Ort: " + benutzer.address.city;

            const firma = document.createElement("p");
            firma.textContent = "Firma: " + benutzer.company.name;

            karte.append(name, untertitel, email, ort, firma);
            return karte;
        }

        function ladeBenutzer() {
            const status = document.getElementById("status");
            const container = document.getElementById("karten");

            const xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4) {
                    if (xhr.status == 200) {
                        const benutzerListe = JSON.parse(xhr.responseText);
                        benutzerListe.forEach(function(benutzer) {
                            container.appendChild(erzeugeKarte(benutzer));
                        });
                        status.textContent = benutzerListe.length + " Benutzer geladen.";
                    } else {
                        status.textContent = "Fehler beim Laden der Daten: HTTP-Status " + xhr.status;
                        status.className = "fehler";
                    }
                }
            };

            xhr.open("GET", API_URL);
            xhr.send();
        }

        ladeBenutzer();
    </script>

</body>
</html>
