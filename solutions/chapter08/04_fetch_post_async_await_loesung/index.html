<!--
    LÖSUNGSVORSCHLAG - ÜBUNG 4: FETCH MIT POST UND ASYNC/AWAIT - CLIENTTEIL
-->
<!DOCTYPE html>
<html>
<head>
    <title>Projekt-Idee einreichen (Fetch POST)</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Projekt-Idee einreichen</h1>

    <form id="ideeForm" onsubmit="return false;">
        <label for="titelFeld">Titel:</label>
        <input type="text" id="titelFeld">
        <br><br>

        <label for="jahrFeld">Jahr:</label>
        <input type="number" id="jahrFeld">
        <br><br>

        <button type="submit" onclick="sende()">Absenden</button>
    </form>

    <p id="ergebnis"></p>

    <script>
        async function sende() {
            var titel = document.getElementById("titelFeld").value;
            var jahr = document.getElementById("jahrFeld").value;

            try {
                var response = await fetch("echo.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ titel: titel, jahr: jahr })
                });

                var ergebnis = await response.json();

                document.getElementById("ergebnis").innerHTML =
                    "Gespeichert: " + ergebnis.titel + " (" + ergebnis.jahr + "), Status: " + ergebnis.status;
            } catch (fehler) {
                document.getElementById("ergebnis").innerHTML = "Fehler beim Senden der Daten.";
            }
        }
    </script>

</body>
</html>
